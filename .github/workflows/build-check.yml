# Catches the generated files drifting from deals.md.
#
# Everything the site publishes about prices -- deals.html, the homepage
# highlights, llms.txt, llms-full.txt, sitemap.xml and the Markdown twins -- is
# generated by scripts/build_seo.py and committed. That only holds if whoever
# updates deals.md remembers to run the script AND to stage everything it wrote.
# Both have failed before: the staged file list in shpr-deals'
# /publish-website-deals drifted behind the script's outputs and would have
# shipped fresh deals next to twins quoting the previous week's prices.
#
# So this job runs the build against the committed tree and fails if anything
# changes. A clean run proves deals.md and every generated file agree.

name: Generated files are current

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # REQUIRED, and not a habit: build_seo.py derives each sitemap
          # <lastmod> from `git log -1 -- <file>`. Under the default shallow
          # clone that lookup finds nothing for files the head commit did not
          # touch, git_date() falls back to today, and the job fails on a
          # sitemap diff that does not exist locally.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # Matched to the machine deals are published from. The script is
          # stdlib-only and not fussy, but a lint job that fails for a reason
          # the author cannot reproduce locally gets switched off, so pin it.
          python-version: '3.10'

      - name: Rebuild the generated files
        id: build
        run: |
          python3 scripts/build_seo.py | tee build.log

      - name: Warn about prose missing from the Markdown twins
        run: |
          # htmlmd.py only emits text from headings, <p> and <li>. Anything else
          # is dropped, and the build reports it rather than losing it quietly.
          # Not a failure: it is usually a nav control, and CHROME_CLASSES is
          # the fix. But it should be seen, not scrolled past.
          if grep -q '^  note:' build.log; then
            while IFS= read -r line; do
              echo "::warning title=Text missing from a .md twin::${line#  note: }"
            done < <(grep '^  note:' build.log)
          fi

      - name: Fail if the build changed anything
        run: |
          rm -f build.log
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Generated files are stale::scripts/build_seo.py produced different output than what is committed. Run it and commit the result."
            echo
            echo "Files that changed:"
            git status --porcelain
            echo
            echo "Diff:"
            # Twins and llms-full.txt restate whole pages, so an unbounded diff
            # is unreadable in a log. Enough to identify what moved.
            git --no-pager diff --stat
            git --no-pager diff -- '*.txt' '*.xml' | head -100
            exit 1
          fi
          echo "Generated files match deals.md."
